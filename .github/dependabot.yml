version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "eslint-plugin-*"
      types:
        patterns: ["@types/*"]
      vite:
        patterns:
          - "vite"
          - "vite-*"
          - "@vitejs/*"
      electron:
        patterns:
          - "electron"
          - "electron-*"
          - "@electron/*"
      monaco:
        patterns:
          - "monaco-*"
          - "@monaco-editor/*"
      playwright:
        patterns:
          - "playwright"
          - "@playwright/*"
    ignore:
      # New react-hooks/refs rule flags existing code; needs React refactor (see #40).
      - dependency-name: eslint-plugin-react-hooks
        versions: [">= 5"]
      # Renderer build error — API change needs investigation (see #44).
      - dependency-name: web-tree-sitter
        versions: [">= 0.26"]
      # @types/node should track the chosen Node runtime, not jump majors blindly.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript major bumps need coordinated migration.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /shared
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      shared-types:
        patterns: ["@types/*"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gh-actions:
        patterns: ["*"]
