name: Lexed CI

# Thin caller for the canonical reusable electron-app CI workflow at
# arthur-debert/release. Bootstraps the canonical fetch-deps from
# release@main when not on PATH; deps.json drives both the
# tree-sitter manifest extract and the per-grammar WASM + highlights
# iteration (via the from-manifest / for-each shape).
#
# See docs/per-stack/electron-ci.md in arthur-debert/release for the
# full input reference.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    uses: arthur-debert/release/.github/workflows/electron-ci.yml@v1
    with:
      node-version: '22.18.0'
      shared-build-dir: shared
      submodules: 'true'
      e2e: true
      e2e-script: test:e2e:ci
      # Bootstrap the canonical fetch-deps from release@main (not on
      # PATH in CI), then fetch every dep in deps.json — including the
      # embedded-grammars iteration that used to live in a separate
      # app-bin script.
      pre-test: |
        if command -v fetch-deps &>/dev/null; then
          FETCH_DEPS_BIN="fetch-deps"
        else
          FETCH_DEPS_BIN="$(mktemp)"
          trap 'rm -f "$FETCH_DEPS_BIN"' EXIT
          curl -fsSL -o "$FETCH_DEPS_BIN" \
            "https://raw.githubusercontent.com/arthur-debert/release/main/bin/fetch-deps"
          chmod +x "$FETCH_DEPS_BIN"
        fi
        "$FETCH_DEPS_BIN" --if-missing
      # lexed's e2e suite (full dev + packaged smoke) regularly takes
      # 15-25min on ubuntu-latest; bump from the canonical's 30min
      # default to give headroom without blanket-extending the check
      # job.
      timeout: 45
