# [secrets] — repo Actions secrets. Each table key is the GitHub secret NAME; the
# value names exactly one source ({ doppler = "KEY" } / { env = "VAR" } /
# { prompt = true }). Seeded with shipit's local-reviewer (codex/agy) GitHub App
# credentials, each sourced from Doppler github/prd. `shipit gh-setup` only pushes
# a secret when its source resolves, so these are safe before the App is installed.
[secrets]
CODEX_REVIEW_APP_PRIVATE_KEY = { doppler = "CODEX_REVIEW_APP_PRIVATE_KEY" }
CODEX_REVIEW_APP_ID          = { doppler = "CODEX_REVIEW_APP_ID" }
AGY_REVIEW_APP_PRIVATE_KEY   = { doppler = "AGY_REVIEW_APP_PRIVATE_KEY" }
AGY_REVIEW_APP_ID            = { doppler = "AGY_REVIEW_APP_ID" }

# [reviewers] — the required-reviewer SET for this repo's PRs (the map KEYS are
# required; ALL must be DONE to flip Ready). Seeded with shipit's shipped default
# (Copilot, review-once), rendered from the single source in
# `prstate.reviewers_config.DEFAULT_REVIEWERS`. codex/agy are NOT seeded by default —
# their review GitHub Apps are not installed on an arbitrary repo, so requiring them
# would park PRs at REVIEWS_PENDING; a repo that HAS the Apps opts them in here (e.g.
# `codex = {}`). Review-once: `rerun` defaults OFF (token-billed; opt in per reviewer
# with e.g. `copilot = { rerun = true }`).
[reviewers]
copilot = {}

# [lint].ignore — paths the managed lint gate must SKIP. Seeded with common
# generated/assembled files (a built CHANGELOG, package lockfiles) that are not
# hand-written prose, so a freshly-onboarded repo does not take a latent gate
# failure on them. Gitignore-style globs. You OWN this list and may extend it —
# it is reconcile-safe: `shipit install` seeds [lint] only when absent and never
# clobbers a table you have edited.
[lint]
ignore = [
  "CHANGELOG.md",
  "CHANGELOG/**",
  "package-lock.json",
  "pnpm-lock.yaml",
  # Intentionally-invalid Lex fixture: its policy violations (reserved doc.*
  # prefix, unknown canonicals, bad attachments) ARE the test — tests/e2e/
  # label-policy.spec.ts opens it and asserts the LSP emits exactly these
  # diagnostics/quickfixes. lexd check cannot pass it without defeating its
  # purpose.
  "tests/fixtures/label-policy.lex",
]

# [lanes] — the declared PR-time check units (ADP02-WS03, #168; modeled on
# lex#829). The lane planner (`shipit ci plan`) maps these + the CI event + a
# path-diff to the job matrix the wf-checks workflow block runs
# (`pixi run --locked <run>` per job). Both lanes' tasks SELF-PROVISION,
# because on a hosted runner nothing outside pixi is provisioned:
#   - `lint-full` (NOT the managed bare `lint` task, which runs in the default
#     env where no lint tool exists) resolves into the pixi lint env, inits
#     the comms submodule (two lexd-checked fixtures are symlinks into it;
#     shipit#759) and provisions lexd inline — see its definition in
#     pixi.toml [feature.lint.tasks].
#   - `test-full` provisions node_modules (`npm ci`, root + shared/) inline
#     before dispatching to `./bin/shipit test` (-> vitest); node/npm and uv
#     (for bin/shipit) ride pixi's default env ([dependencies] in pixi.toml).
# The e2e suite is NOT a lane: it stays on the companion e2e.yml caller of
# release's electron-ci.yml (packaged-Electron Playwright run under xvfb with
# submodules, fetch-deps artifacts, browser system deps, and report-artifact
# upload — surface the wf-checks block deliberately doesn't carry).
[lanes.lint]
run = "lint-full"
required = true
local = true

[lanes.test]
run = "test-full"
required = true
local = true

[toolchains]
# Per-path build override (ADP02-WS09, #172): the registry default (`npm run
# build`) assumes a provisioned tree, but the wf-build block's checkout
# provisions nothing beyond pixi (no node_modules, no comms submodule, no
# fetch-deps artifacts — the same bare-runner premise the WS03 lanes
# self-provision around). `build:release` (package.json) chains the
# self-provisioning script (app-bin/release-provision.sh: comms submodule,
# npm ci root + shared/, fetch-deps onto node_modules/.bin) into the ordinary
# `npm run build`. A local `shipit build` runs the same path — reproducible,
# lockfile-exact, like the test-full lane.
"." = { toolchain = "npm", build = ["npm", "run", "build:release"] }

# [artifacts] — the declared release surface (ADP02-WS09, #172; workstream of
# arthur-debert/shipit#842). ONE electron artifact, the legacy v0.11.0 asset
# set re-declared on shipit's electron composition (shipit#823 decision
# record):
#   - darwin-arm64: LexEd-<v>-arm64.dmg (+ .dmg.blockmap) — built UNSIGNED
#     (electron-builder's own codesign/notarize stay OFF: no CSC_* env rides
#     the build leg, package.json keeps `notarize: false`, and the afterPack
#     appex hook skips without CSC_LINK), re-emitted as the unsigned-app
#     reseal payload the STANDALONE mac-sign stage reopens → resigns
#     inner-first with per-code-role JIT entitlements (shipit#833) → reseals
#     the .dmg → notarizes. `sign = true` derives the Apple cert + notary
#     secret requirement through the standard sign-stage path.
#   - linux-x86_64: LexEd-<v>.AppImage (a blockmap is collected only when
#     present — legacy shipped none). Ships unsigned, per legacy.
#   - windows-x86_64: LexEd.Setup.<v>.exe (+ .exe.blockmap). Declared for
#     legacy parity; the leg runs shipit on a windows runner and is BLOCKED
#     on shipit#893 (win-importability) — the coordinator sequences the rc
#     proof after that fix. Ships unsigned, per legacy.
# The bundle command is `npm run dist` (bare electron-builder): the build
# stage's `build:release` already compiled tsc/vite and ran electron-builder
# once, so the bundle stage's declared-command run is an idempotent repackage
# over the same compiled tree into `release/` (package.json
# directories.output — distinct from the bundle output tree, as the
# composition requires), which the composition then collects from.
# `product-name` anchors assert-bundle's dmg/AppImage filename fallback tier;
# the darwin reseal payload's CFBundleExecutable (LexEd) is the authoritative
# tier.
[artifacts.lexed]
build = ["npm"]
platforms = ["darwin-arm64", "linux-x86_64", "windows-x86_64"]
bundle = { composition = "electron", command = ["npm", "run", "dist"], source = "release" }
product-name = "LexEd"
endpoints = ["gh-release"]
sign = true

